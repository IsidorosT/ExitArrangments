plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'gr.exodouxoi'
    compileSdk 35

    defaultConfig {
        applicationId 'gr.exodouxoi'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.${runNumber}"
    }

    // Σταθερό κλειδί ώστε κάθε νέα έκδοση να εγκαθίσταται πάνω από την παλιά χωρίς να χάνονται δεδομένα.
    signingConfigs {
        release {
            storeFile file('../keystore/exodouxoi.jks')
            storePassword 'exodouxoi'
            keyAlias 'exodouxoi'
            keyPassword 'exodouxoi'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
