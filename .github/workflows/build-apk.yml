name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Restore signing key from secrets
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Pick APK
        run: |
          out=android/app/build/outputs/apk/release
          if [ -f "$out/app-release.apk" ]; then
            cp "$out/app-release.apk" Exodouxoi.apk; echo "APK_NAME=Exodouxoi.apk" >> "$GITHUB_ENV"
          else
            cp "$out/app-release-unsigned.apk" Exodouxoi-unsigned.apk; echo "APK_NAME=Exodouxoi-unsigned.apk" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_B64 secret: the APK is unsigned and cannot be installed."
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Exodouxoi-apk
          path: ${{ env.APK_NAME }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" "$APK_NAME" \
            --title "Εξοδούχοι v1.${{ github.run_number }}" \
            --notes "APK για Android. Εγκατάσταση: κατέβασέ το στο κινητό και άνοιξέ το." \
            --latest
