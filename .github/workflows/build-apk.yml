name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Exodouxoi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Exodouxoi-apk
          path: Exodouxoi.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" Exodouxoi.apk \
            --title "Εξοδούχοι v1.${{ github.run_number }}" \
            --notes "APK για Android. Εγκατάσταση: κατέβασέ το στο κινητό και άνοιξέ το." \
            --latest
